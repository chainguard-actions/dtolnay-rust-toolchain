name: Test basic stable install
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          toolchain: stable
      - name: Assert name output
        env:
          ACTUAL: ${{ steps.action.outputs.name }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "stable" ]; then
            echo "FAIL: expected 'stable'"
            exit 1
          fi
          echo "PASS"
      - name: Assert cachekey output
        env:
          ACTUAL: ${{ steps.action.outputs.cachekey }}
        run: |
          echo "actual: $ACTUAL"
          if ! [[ "$ACTUAL" =~ ^20[0-9]{6}[0-9a-f]{4}$ ]]; then
            echo "FAIL: cachekey should be 8-digit date + 4 hex chars"
            exit 1
          fi
          echo "PASS"
      - name: Assert rustc and cargo work
        shell: bash
        run: |
          rustc --version
          cargo --version
          rustc +stable --version | grep -q '^rustc 1\.' || { echo "FAIL: rustc +stable not working"; exit 1; }
          echo "PASS"
      - name: Assert env vars exported
        shell: bash
        run: |
          echo "CARGO_INCREMENTAL=$CARGO_INCREMENTAL CARGO_TERM_COLOR=$CARGO_TERM_COLOR CARGO_HOME=$CARGO_HOME"
          [ "$CARGO_INCREMENTAL" = "0" ] || { echo "FAIL: CARGO_INCREMENTAL"; exit 1; }
          [ "$CARGO_TERM_COLOR" = "always" ] || { echo "FAIL: CARGO_TERM_COLOR"; exit 1; }
          [ -n "$CARGO_HOME" ] || { echo "FAIL: CARGO_HOME empty"; exit 1; }
          echo "PASS"
