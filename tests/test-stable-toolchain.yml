name: Test stable toolchain install
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          toolchain: stable
      - name: Assert cachekey output is set
        env:
          CACHEKEY: ${{ steps.action.outputs.cachekey }}
        run: |
          echo "cachekey: $CACHEKEY"
          if [ -z "$CACHEKEY" ]; then
            echo "FAIL: cachekey output is empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert name output is set
        env:
          NAME: ${{ steps.action.outputs.name }}
        run: |
          echo "name: $NAME"
          if [ -z "$NAME" ]; then
            echo "FAIL: name output is empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert rustc is available
        run: |
          rustc --version
          echo "PASS: rustc is available"
