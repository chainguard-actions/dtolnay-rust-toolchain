name: Test target alias input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: toolchain
        name: Install stable Rust using target alias input
        uses: .
        with:
          toolchain: stable
          target: x86_64-unknown-linux-musl

      - name: Assert cachekey output is set
        env:
          CACHEKEY: ${{ steps.toolchain.outputs.cachekey }}
        run: |
          echo "cachekey: $CACHEKEY"
          if [ -z "$CACHEKEY" ]; then
            echo "FAIL: cachekey output is empty"
            exit 1
          fi
          echo "PASS: cachekey=$CACHEKEY"

      - name: Assert musl target is installed
        run: |
          TARGETS=$(rustup target list --installed)
          echo "installed targets: $TARGETS"
          if ! echo "$TARGETS" | grep -q "x86_64-unknown-linux-musl"; then
            echo "FAIL: x86_64-unknown-linux-musl target not found in installed targets"
            exit 1
          fi
          echo "PASS: x86_64-unknown-linux-musl target is installed"
