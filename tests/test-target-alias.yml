name: Test target alias install
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
      - name: Assert target installed
        shell: bash
        run: |
          rustup +stable target list --installed
          rustup +stable target list --installed | grep -qx 'wasm32-unknown-unknown' || { echo "FAIL: wasm32 target missing"; exit 1; }
          echo "PASS"
