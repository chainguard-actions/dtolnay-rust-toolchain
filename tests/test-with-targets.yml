name: Test toolchain with targets
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: toolchain
        name: Install stable Rust with wasm32 target
        uses: .
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Assert cachekey output is set
        env:
          CACHEKEY: ${{ steps.toolchain.outputs.cachekey }}
        run: |
          echo "cachekey: $CACHEKEY"
          if [ -z "$CACHEKEY" ]; then
            echo "FAIL: cachekey output is empty"
            exit 1
          fi
          echo "PASS: cachekey=$CACHEKEY"

      - name: Assert wasm32 target is installed
        run: |
          TARGETS=$(rustup target list --installed)
          echo "installed targets: $TARGETS"
          if ! echo "$TARGETS" | grep -q 'wasm32-unknown-unknown'; then
            echo "FAIL: wasm32-unknown-unknown target not installed"
            exit 1
          fi
          echo "PASS: wasm32-unknown-unknown target is installed"
