name: Test specific version install
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          toolchain: 1.70.0
      - name: Assert name output
        env:
          ACTUAL: ${{ steps.action.outputs.name }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "1.70.0" ]; then
            echo "FAIL: expected '1.70.0'"
            exit 1
          fi
          echo "PASS"
      - name: Assert cachekey output
        env:
          ACTUAL: ${{ steps.action.outputs.cachekey }}
        run: |
          echo "actual: $ACTUAL"
          # rust 1.70.0 commit-date 2023-05-31
          if ! [[ "$ACTUAL" =~ ^20230531[0-9a-f]{4}$ ]]; then
            echo "FAIL: expected 20230531 + 4 hex chars"
            exit 1
          fi
          echo "PASS"
      - name: Assert installed version and env
        shell: bash
        run: |
          rustc +1.70.0 --version
          rustc +1.70.0 --version | grep -q '^rustc 1\.70\.0' || { echo "FAIL: wrong rustc"; exit 1; }
          echo "CARGO_HTTP_MULTIPLEXING=$CARGO_HTTP_MULTIPLEXING"
          [ "$CARGO_HTTP_MULTIPLEXING" = "false" ] || { echo "FAIL: CARGO_HTTP_MULTIPLEXING should be false for 1.70"; exit 1; }
          echo "PASS"
