name: Test short minor version (1.68)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          toolchain: "1.68"
      - name: Assert name output
        env:
          ACTUAL: ${{ steps.action.outputs.name }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "1.68" ]; then
            echo "FAIL: expected '1.68'"
            exit 1
          fi
          echo "PASS"
      - name: Assert installed version and sparse registry
        shell: bash
        run: |
          rustc +1.68 --version
          rustc +1.68 --version | grep -q '^rustc 1\.68\.' || { echo "FAIL: wrong rustc"; exit 1; }
          echo "CARGO_REGISTRIES_CRATES_IO_PROTOCOL=$CARGO_REGISTRIES_CRATES_IO_PROTOCOL"
          [ "$CARGO_REGISTRIES_CRATES_IO_PROTOCOL" = "sparse" ] || { echo "FAIL: expected sparse"; exit 1; }
          echo "PASS"
