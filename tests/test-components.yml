name: Test toolchain install with components
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          toolchain: stable
          components: clippy,rustfmt
      - name: Assert cachekey output is set
        env:
          CACHEKEY: ${{ steps.action.outputs.cachekey }}
        run: |
          echo "cachekey: $CACHEKEY"
          if [ -z "$CACHEKEY" ]; then
            echo "FAIL: cachekey output is empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert clippy is available
        run: |
          cargo clippy --version
          echo "PASS"
      - name: Assert rustfmt is available
        run: |
          cargo fmt --version
          echo "PASS"
