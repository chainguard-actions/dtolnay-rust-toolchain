name: Test components install
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Assert components installed
        shell: bash
        run: |
          rustup +stable component list --installed
          rustup +stable component list --installed | grep -q '^rustfmt' || { echo "FAIL: rustfmt missing"; exit 1; }
          rustup +stable component list --installed | grep -q '^clippy' || { echo "FAIL: clippy missing"; exit 1; }
          cargo +stable fmt --version
          cargo +stable clippy --version
          echo "PASS"
