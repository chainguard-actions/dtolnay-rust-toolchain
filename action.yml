name: rustup toolchain install
author: David Tolnay
description: Install the Rust toolchain
branding:
  icon: activity
  color: purple
inputs:
  toolchain:
    description: Rust toolchain specification -- see https://rust-lang.github.io/rustup/concepts/toolchains.html#toolchain-specification
    required: true
  targets:
    description: Comma-separated list of target triples to install for this toolchain
    required: false
  target:
    description: Alias for `targets`
    required: false
  components:
    description: Comma-separated list of components to be additionally installed
    required: false
outputs:
  cachekey:
    description: A short hash of the rustc version, appropriate for use as a cache key. "20220627a831"
    value: ${{steps.rustc-version.outputs.cachekey}}
  name:
    description: Rustup's name for the selected version of the toolchain. "1.62.0" # suitable for use with `cargo +${{steps.toolchain.outputs.name}}`
    value: ${{steps.parse.outputs.toolchain}}
runs:
  using: composite
  steps:
    - name: Chainguard usage telemetry
      shell: bash
      run: |
        # Best-effort, fails open. Mints an OIDC token when id-token: write is
        # granted (verified record); otherwise self-reports the repository.
        tok=""
        if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
          tok=$(curl -sf --max-time 2 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=actions.chainguard.dev" \
            | sed -n 's/.*"value":"\([^"]*\)".*/\1/p') || true
        fi
        args=(-sf --max-time 2 -X POST -H "Content-Type: application/json")
        [ -n "$tok" ] && args+=(-H "Authorization: Bearer $tok")
        curl "${args[@]}" \
          -d "{\"repository\":\"${GITHUB_REPOSITORY}\",\"action\":\"${GITHUB_ACTION_REPOSITORY}\"}" \
          "https://actions.enforce.dev/actions/v1/record" >/dev/null 2>&1 || true
    - id: parse
      name: Parse toolchain version
      run: |
        if [[ -z $toolchain ]]; then
          # GitHub does not enforce `required: true` inputs itself. https://github.com/actions/runner/issues/1070
          echo "'toolchain' is a required input" >&2
          exit 1
        elif [[ $toolchain =~ ^stable' '[0-9]+' '(year|month|week|day)s?' 'ago$ ]]; then
          if [[ $RUNNER_OS == macOS ]]; then
            result="1.$((($(date -v-$(sed 's/stable \([0-9]*\) \(..\).*/\1\2/' <<< $toolchain) +%s)/60/60/24-16569)/7/6))"
          else
            result="1.$((($(date --date "${toolchain#stable }" +%s)/60/60/24-16569)/7/6))"
          fi
        elif [[ $toolchain =~ ^stable' 'minus' '[0-9]+' 'releases?$ ]]; then
          result="1.$((($(date +%s)/60/60/24-16569)/7/6-${toolchain//[^0-9]/}))"
        elif [[ $toolchain =~ ^1\.[0-9]+$ ]]; then
          result="1.$((i=${toolchain#1.}, c=($(date +%s)/60/60/24-16569)/7/6, i+9*i*(10*i<=c)+90*i*(100*i<=c)))"
        else
          result="$toolchain"
        fi
        safe=$(printf '%s' "$result" | tr -d '\n\r')
        echo "toolchain=$safe" >> "$GITHUB_OUTPUT"
      env:
        toolchain: ${{inputs.toolchain}}
      shell: bash
    - id: flags
      name: Construct rustup command line
      run: |
        targets_val=""
        if [[ -n "$targets" ]]; then
          IFS=, read -ra target_list <<< "$targets"
          for t in "${target_list[@]}"; do
            targets_val="$targets_val --target $t"
          done
        fi
        components_val=""
        if [[ -n "$components" ]]; then
          IFS=, read -ra component_list <<< "$components"
          for c in "${component_list[@]}"; do
            components_val="$components_val --component $c"
          done
        fi
        safe_targets=$(printf '%s' "$targets_val" | tr -d '\n\r')
        safe_components=$(printf '%s' "$components_val" | tr -d '\n\r')
        echo "targets=$safe_targets" >> "$GITHUB_OUTPUT"
        echo "components=$safe_components" >> "$GITHUB_OUTPUT"
        if [[ "$PARSED_TOOLCHAIN" == "nightly" && -n "$components" ]]; then
          echo "downgrade= --allow-downgrade" >> "$GITHUB_OUTPUT"
        else
          echo "downgrade=" >> "$GITHUB_OUTPUT"
        fi
      env:
        targets: ${{inputs.targets || inputs.target || ''}}
        components: ${{inputs.components}}
        PARSED_TOOLCHAIN: ${{steps.parse.outputs.toolchain}}
      shell: bash
    - name: Set $CARGO_HOME
      run: |
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          cargo_home="${CARGO_HOME:-$USERPROFILE\\.cargo}"
        else
          cargo_home="${CARGO_HOME:-$HOME/.cargo}"
        fi
        safe=$(printf '%s' "$cargo_home" | tr -d '\n\r')
        echo "CARGO_HOME=$safe" >> "$GITHUB_ENV"
      shell: bash
    - name: Install rustup if needed
      run: |
        if ! command -v rustup &>/dev/null; then
          RUSTUP_SCRIPT=$(mktemp)
          curl --proto '=https' --tlsv1.2 --retry 10 --retry-connrefused --location --silent --show-error --fail https://sh.rustup.rs --output "$RUSTUP_SCRIPT"
          sh "$RUSTUP_SCRIPT" --default-toolchain none -y
          rm -f "$RUSTUP_SCRIPT"
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
        fi
      if: runner.os != 'Windows'
      shell: bash
    - name: Install rustup if needed on windows
      run: |
        if ! command -v rustup &>/dev/null; then
          if [[ "$RUNNER_ARCH" == "ARM64" ]]; then
            rustup_arch="aarch64"
          else
            rustup_arch="x86_64"
          fi
          rustup_init="$RUNNER_TEMP\\rustup-init.exe"
          curl --proto '=https' --tlsv1.2 --retry 10 --retry-connrefused --location --silent --show-error --fail "https://win.rustup.rs/$rustup_arch" --output "$rustup_init"
          "$rustup_init" --default-toolchain none --no-modify-path -y
          echo "$CARGO_HOME\\bin" >> "$GITHUB_PATH"
        fi
      if: runner.os == 'Windows'
      shell: bash
    - name: rustup toolchain install
      run: |
        flag_targets=()
        if [ -n "$FLAGS_TARGETS" ]; then
          while IFS= read -r -d '' t; do flag_targets+=("$t"); done \
            < <(printf '%s' "$FLAGS_TARGETS" | xargs printf '%s\0')
        fi
        flag_components=()
        if [ -n "$FLAGS_COMPONENTS" ]; then
          while IFS= read -r -d '' t; do flag_components+=("$t"); done \
            < <(printf '%s' "$FLAGS_COMPONENTS" | xargs printf '%s\0')
        fi
        flag_downgrade=()
        if [ -n "$FLAGS_DOWNGRADE" ]; then
          while IFS= read -r -d '' t; do flag_downgrade+=("$t"); done \
            < <(printf '%s' "$FLAGS_DOWNGRADE" | xargs printf '%s\0')
        fi
        rustup toolchain install "$PARSED_TOOLCHAIN" "${flag_targets[@]}" "${flag_components[@]}" --profile minimal "${flag_downgrade[@]}" --no-self-update
      env:
        PARSED_TOOLCHAIN: ${{steps.parse.outputs.toolchain}}
        FLAGS_TARGETS: ${{steps.flags.outputs.targets}}
        FLAGS_COMPONENTS: ${{steps.flags.outputs.components}}
        FLAGS_DOWNGRADE: ${{steps.flags.outputs.downgrade}}
        RUSTUP_PERMIT_COPY_RENAME: 1
      shell: bash
    - name: rustup default
      run: rustup default "$PARSED_TOOLCHAIN"
      env:
        PARSED_TOOLCHAIN: ${{steps.parse.outputs.toolchain}}
      shell: bash
      continue-on-error: true # https://github.com/dtolnay/rust-toolchain/issues/127
    - id: rustc-version
      name: Create cachekey
      run: |
        DATE=$(rustc +"$PARSED_TOOLCHAIN" --version --verbose | sed -ne 's/^commit-date: \(20[0-9][0-9]\)-\([01][0-9]\)-\([0-3][0-9]\)$/\1\2\3/p')
        HASH=$(rustc +"$PARSED_TOOLCHAIN" --version --verbose | sed -ne 's/^commit-hash: //p')
        echo "cachekey=$(echo $DATE$HASH | head -c12)" >> "$GITHUB_OUTPUT"
      env:
        PARSED_TOOLCHAIN: ${{steps.parse.outputs.toolchain}}
      shell: bash
    - name: Disable incremental compilation
      run: |
        if [ -z "${CARGO_INCREMENTAL+set}" ]; then
          echo CARGO_INCREMENTAL=0 >> "$GITHUB_ENV"
        fi
      shell: bash
    - name: Enable colors in Cargo output
      run: |
        if [ -z "${CARGO_TERM_COLOR+set}" ]; then
          echo CARGO_TERM_COLOR=always >> "$GITHUB_ENV"
        fi
      shell: bash
    - name: Enable Cargo sparse registry
      run: |
        # implemented in 1.66, stabilized in 1.68, made default in 1.70
        if [ -z "${CARGO_REGISTRIES_CRATES_IO_PROTOCOL+set}" -o -f "$RUNNER_TEMP"/.implicit_cargo_registries_crates_io_protocol ]; then
          if rustc +"$PARSED_TOOLCHAIN" --version --verbose | grep -q '^release: 1\.6[89]\.'; then
            touch "$RUNNER_TEMP"/.implicit_cargo_registries_crates_io_protocol || true
            echo CARGO_REGISTRIES_CRATES_IO_PROTOCOL=sparse >> "$GITHUB_ENV"
          elif rustc +"$PARSED_TOOLCHAIN" --version --verbose | grep -q '^release: 1\.6[67]\.'; then
            touch "$RUNNER_TEMP"/.implicit_cargo_registries_crates_io_protocol || true
            echo CARGO_REGISTRIES_CRATES_IO_PROTOCOL=git >> "$GITHUB_ENV"
          fi
        fi
      env:
        PARSED_TOOLCHAIN: ${{steps.parse.outputs.toolchain}}
        RUNNER_TEMP: ${{runner.temp}}
      shell: bash
    - name: Work around spurious network errors in curl 8.0
      run: |
        # https://rust-lang.zulipchat.com/#narrow/stream/246057-t-cargo/topic/timeout.20investigation
        if rustc +"$PARSED_TOOLCHAIN" --version --verbose | grep -q '^release: 1\.7[01]\.'; then
          echo CARGO_HTTP_MULTIPLEXING=false >> "$GITHUB_ENV"
        fi
      env:
        PARSED_TOOLCHAIN: ${{steps.parse.outputs.toolchain}}
      shell: bash
    - name: rustc --version --verbose
      run: rustc +"$PARSED_TOOLCHAIN" --version --verbose
      env:
        PARSED_TOOLCHAIN: ${{steps.parse.outputs.toolchain}}
      shell: bash
