name: rustup toolchain install
author: David Tolnay
description: Install the Rust toolchain
branding:
  icon: activity
  color: purple

inputs:
  toolchain:
    description: Rust toolchain specification -- see https://rust-lang.github.io/rustup/concepts/toolchains.html#toolchain-specification
    required: true
  targets:
    description: Comma-separated list of target triples to install for this toolchain
    required: false
  target:
    description: Alias for `targets`
    required: false
  components:
    description: Comma-separated list of components to be additionally installed
    required: false

outputs:
  cachekey:
    description: A short hash of the rustc version, appropriate for use as a cache key. "20220627a831"
    value: ${{steps.rustc-version.outputs.cachekey}}
  name:
    description: Rustup's name for the selected version of the toolchain. "1.62.0"  # suitable for use with `cargo +${{steps.toolchain.outputs.name}}`
    value: ${{steps.parse.outputs.toolchain}}

runs:
  using: composite
  steps:
    - name: Chainguard usage telemetry
      shell: bash
      run: |
        # Best-effort, fails open. Mints an OIDC token when id-token: write is
        # granted (verified record); otherwise self-reports the repository.
        tok=""
        if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
          tok=$(curl -sf --max-time 2 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=actions.chainguard.dev" \
            | sed -n 's/.*"value":"\([^"]*\)".*/\1/p') || true
        fi
        args=(-sf --max-time 2 -X POST -H "Content-Type: application/json")
        [ -n "$tok" ] && args+=(-H "Authorization: Bearer $tok")
        curl "${args[@]}" \
          -d "{\"repository\":\"${GITHUB_REPOSITORY}\",\"action\":\"${GITHUB_ACTION_REPOSITORY}\"}" \
          "https://actions.enforce.dev/actions/v1/record" >/dev/null 2>&1 || true
    - id: parse
      name: Parse toolchain version
      run: |
        if [[ -z "$toolchain" ]]; then
          # GitHub does not enforce `required: true` inputs itself. https://github.com/actions/runner/issues/1070
          echo "'toolchain' is a required input" >&2
          exit 1
        elif [[ "$toolchain" =~ ^stable' '[0-9]+' '(year|month|week|day)s?' 'ago$ ]]; then
          if [[ "$RUNNER_OS" == macOS ]]; then
            ago="$(sed 's/stable \([0-9]*\) \(.\).*/\1\2/' <<< "$toolchain")" || true
            secs="$(date -v-"$ago" +%s)" || true
            echo "toolchain=1.$(((secs/60/60/24-16569)/7/6))" >> "$GITHUB_OUTPUT"
          else
            secs="$(date --date "${toolchain#stable }" +%s)" || true
            echo "toolchain=1.$(((secs/60/60/24-16569)/7/6))" >> "$GITHUB_OUTPUT"
          fi
        elif [[ "$toolchain" =~ ^stable' 'minus' '[0-9]+' 'releases?$ ]]; then
          minus="${toolchain//[^0-9]/}"
          now="$(date +%s)" || true
          echo "toolchain=1.$(((now/60/60/24-16569)/7/6-minus))" >> "$GITHUB_OUTPUT"
        elif [[ "$toolchain" =~ ^1\.[0-9]+$ ]]; then
          i="${toolchain#1.}"
          now="$(date +%s)" || true
          echo "toolchain=1.$((c=(now/60/60/24-16569)/7/6, i+9*i*(10*i<=c)+90*i*(100*i<=c)))" >> "$GITHUB_OUTPUT"
        else
          safe_toolchain=$(printf '%s' "$toolchain" | tr -d '\n\r')
          printf 'toolchain=%s\n' "$safe_toolchain" >> "$GITHUB_OUTPUT"
        fi
      env:
        toolchain: ${{inputs.toolchain}}
      shell: bash

    - name: Set $CARGO_HOME
      run: |
        if [[ "$RUNNER_OS" == Windows ]]; then
          default_cargo_home="$USERPROFILE"'\.cargo'
        else
          default_cargo_home="$HOME/.cargo"
        fi
        cargo_home_value="${CARGO_HOME:-$default_cargo_home}"
        safe_cargo_home=$(printf '%s' "$cargo_home_value" | tr -d '\n\r')
        echo "CARGO_HOME=$safe_cargo_home" >> "$GITHUB_ENV"
      shell: bash

    - name: Install rustup, if needed
      run: |
        if ! command -v rustup &>/dev/null; then
          rustup_init="$RUNNER_TEMP/rustup-init.sh"
          curl --proto '=https' --tlsv1.2 --retry 10 --retry-connrefused --location --silent --show-error --fail https://sh.rustup.rs --output "$rustup_init"
          sh "$rustup_init" --default-toolchain none -y
          rm -f "$rustup_init"
          safe_path=$(printf '%s' "$CARGO_HOME/bin" | tr -d '\n\r')
          echo "$safe_path" >> "$GITHUB_PATH"
        fi
      if: runner.os != 'Windows'
      shell: bash

    - name: Install rustup, if needed
      run: |
        if ! command -v rustup &>/dev/null; then
          if [[ "$RUNNER_ARCH" == ARM64 ]]; then rustup_arch=aarch64; else rustup_arch=x86_64; fi
          rustup_init="$RUNNER_TEMP"'\rustup-init.exe'
          curl --proto '=https' --tlsv1.2 --retry 10 --retry-connrefused --location --silent --show-error --fail "https://win.rustup.rs/$rustup_arch" --output "$rustup_init"
          "$rustup_init" --default-toolchain none --no-modify-path -y
          safe_path=$(printf '%s' "$CARGO_HOME"'\bin' | tr -d '\n\r')
          echo "$safe_path" >> "$GITHUB_PATH"
        fi
      if: runner.os == 'Windows'
      shell: bash

    - name: rustup toolchain install ${{steps.parse.outputs.toolchain}}
      run: |
        # split targets and components on commas and whitespace, without glob expansion
        flags=()
        target_list=()
        if [[ -n "$targets" ]]; then
          read -r -d '' -a target_list <<< "${targets//,/ }" || true
        fi
        for t in "${target_list[@]}"; do flags+=(--target "$t"); done
        component_list=()
        if [[ -n "$components" ]]; then
          read -r -d '' -a component_list <<< "${components//,/ }" || true
        fi
        for c in "${component_list[@]}"; do flags+=(--component "$c"); done
        if [[ "$toolchain" == nightly && -n "$components" ]]; then flags+=(--allow-downgrade); fi
        log=$(mktemp)
        trap 'rm -f "$log"' EXIT
        for attempt in 1 2 3 4 5; do
          if rustup toolchain install "$toolchain" "${flags[@]}" --profile minimal --no-self-update --force-non-host 2>&1 | tee "$log"; then
            break
          else
            status=$?
          fi
          if [[ $attempt == 5 ]] || ! grep -Fq 'checksum failed for ' "$log" \
              || ! grep -Fq 'this is likely due to an ongoing update of the official release server' "$log"; then
            exit "$status"
          fi
          echo "Retrying rustup toolchain install in 30 seconds (retry $attempt of 4)" >&2
          sleep 30
        done
      env:
        toolchain: ${{steps.parse.outputs.toolchain}}
        targets: ${{inputs.targets || inputs.target || ''}}
        components: ${{inputs.components}}
        RUSTUP_PERMIT_COPY_RENAME: 1
      shell: bash

    - name: rustup default ${{steps.parse.outputs.toolchain}}
      run: rustup default "$toolchain" --force-non-host
      env:
        toolchain: ${{steps.parse.outputs.toolchain}}
      shell: bash
      continue-on-error: true  # https://github.com/dtolnay/rust-toolchain/issues/127

    - id: rustc-version
      name: Create cachekey
      run: |
        DATE=$(rustc +"$toolchain" --version --verbose | sed -ne 's/^commit-date: \(20[0-9][0-9]\)-\([01][0-9]\)-\([0-3][0-9]\)$/\1\2\3/p')
        HASH=$(rustc +"$toolchain" --version --verbose | sed -ne 's/^commit-hash: //p')
        echo "cachekey=$(printf '%s' "$DATE$HASH" | tr -d '\n\r' | head -c12)" >> "$GITHUB_OUTPUT"
      env:
        toolchain: ${{steps.parse.outputs.toolchain}}
      shell: bash

    - name: Disable incremental compilation
      run: |
        if [ -z "${CARGO_INCREMENTAL+set}" ]; then
          echo CARGO_INCREMENTAL=0 >> "$GITHUB_ENV"
        fi
      shell: bash

    - name: Enable colors in Cargo output
      run: |
        if [ -z "${CARGO_TERM_COLOR+set}" ]; then
          echo CARGO_TERM_COLOR=always >> "$GITHUB_ENV"
        fi
      shell: bash

    - name: Enable Cargo sparse registry
      run: |
        # implemented in 1.66, stabilized in 1.68, made default in 1.70
        if [ -z "${CARGO_REGISTRIES_CRATES_IO_PROTOCOL+set}" -o -f "$RUNNER_TEMP"/.implicit_cargo_registries_crates_io_protocol ]; then
          if rustc +"$toolchain" --version --verbose | grep -q '^release: 1\.6[89]\.'; then
            touch "$RUNNER_TEMP"/.implicit_cargo_registries_crates_io_protocol || true
            echo CARGO_REGISTRIES_CRATES_IO_PROTOCOL=sparse >> "$GITHUB_ENV"
          elif rustc +"$toolchain" --version --verbose | grep -q '^release: 1\.6[67]\.'; then
            touch "$RUNNER_TEMP"/.implicit_cargo_registries_crates_io_protocol || true
            echo CARGO_REGISTRIES_CRATES_IO_PROTOCOL=git >> "$GITHUB_ENV"
          fi
        fi
      env:
        toolchain: ${{steps.parse.outputs.toolchain}}
      shell: bash

    - name: Work around spurious network errors in curl 8.0
      run: |
        # https://rust-lang.zulipchat.com/#narrow/stream/246057-t-cargo/topic/timeout.20investigation
        if rustc +"$toolchain" --version --verbose | grep -q '^release: 1\.7[01]\.'; then
          echo CARGO_HTTP_MULTIPLEXING=false >> "$GITHUB_ENV"
        fi
      env:
        toolchain: ${{steps.parse.outputs.toolchain}}
      shell: bash

    - name: rustc +${{steps.parse.outputs.toolchain}} --version --verbose
      run: rustc +"$toolchain" --version --verbose
      env:
        toolchain: ${{steps.parse.outputs.toolchain}}
      shell: bash
